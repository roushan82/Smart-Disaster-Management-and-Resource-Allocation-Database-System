<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Reviewer Sign In</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 30px; background: #f1f5f9; color: #1e293b; }
        main { max-width: 460px; margin: 8vh auto; padding: 28px; background: white; border-radius: 12px; box-shadow: 0 4px 12px #0001; }
        label { display: block; margin: 16px 0 6px; font-weight: bold; }
        input { width: 100%; padding: 11px; border: 1px solid #94a3b8; border-radius: 6px; }
        button { margin-top: 20px; padding: 11px 18px; border: 0; border-radius: 6px; background: #172554; color: white; font-weight: bold; cursor: pointer; }
        .error { padding: 12px; background: #fee2e2; color: #991b1b; border-radius: 6px; }
    </style>
</head>
<body>
<main>
    <h1>Historical Detection Review</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% if login_enabled %}
    <form method="post">
        {% include "shared/_csrf_field.html" %}
        <label for="username">Reviewer username</label>
        <input id="username" name="username" autocomplete="username" required maxlength="150">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
    {% endif %}
</main>
</body>
</html>
